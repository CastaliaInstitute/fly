name: Deploy Memory Garden to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research book dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Test experiment and FlyWire ingestion code
        run: python -m unittest discover -s research/tests -v
      - name: Build executable Jupyter Book
        env:
          BASE_URL: /research
        working-directory: research/book
        run: jupyter book build --html --execute --strict
      - name: Assemble Pages site
        run: |
          mkdir -p _site/research
          cp index.html styles.css app.js CNAME _site/
          touch _site/.nojekyll
          cp -R research/book/_build/html/. _site/research/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
